name: Validate handbook

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Markdown renders correctly (fences, Mermaid, labels, tables)
        run: python scripts/check_markdown_structure.py
      - name: Parse every Mermaid diagram with the real Mermaid CLI
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm install -g @mermaid-js/mermaid-cli@11.16.0
          python scripts/check_mermaid.py
      - name: Check links and reading order
        run: python scripts/check_internal_links.py
      - name: Check all chapter answer keys and links
        run: python scripts/check_answer_coverage.py
      - name: Check HarborCart transaction-to-payout accounting
        run: python scripts/verify_harborcart_reconciliation.py
      - name: Check authorization case numbers
        run: python scripts/verify_case.py
      - name: Check HarborCart metric arithmetic
        run: python scripts/verify_metrics.py
      - name: Verify operational case-lab inputs and arithmetic
        run: python scripts/verify_operational_cases.py
      - name: Check worked chapter and answer-key arithmetic
        run: python scripts/verify_chapter_arithmetic.py
      - name: Check fictional agentic checkout consent constraints
        run: python scripts/verify_agentic_cases.py
